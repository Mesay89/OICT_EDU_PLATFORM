services:
  # ── Backend (Node / Express) ──────────────────────────────────────────────
  - type: web
    name: backend
    env: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://your-frontend-url.onrender.com

  # ── Frontend (React / Vite – Static Site) ────────────────────────────────
  - type: web
    name: frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    # Critical: rewrite ALL paths to index.html so React Router handles them.
    # Without this, refreshing any route (e.g. /login, /dashboard) returns 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
